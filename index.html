<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D RPG Demo</title>
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div id="status">
      <div class="status-name">휴리안</div>
      <div class="bar hp"><div id="hp-fill" class="fill"></div></div>
      <div class="bar mp"><div id="mp-fill" class="fill"></div></div>
    </div>

    <div id="objective">남은 적: <span id="enemy-count">0</span></div>

    <div id="toast"></div>

    <div id="skills">
      <div class="skill" id="skill-dash">
        <div class="skill-key">SPACE</div>
        <div class="skill-icon">💨</div>
        <div class="skill-cooldown" id="dash-cooldown"></div>
      </div>
      <div class="skill" id="skill-attack">
        <div class="skill-key">X</div>
        <div class="skill-icon">⚔️</div>
        <div class="skill-cooldown" id="attack-cooldown"></div>
      </div>
    </div>

    <div id="hint">WASD 이동 &nbsp;|&nbsp; Space 대시 &nbsp;|&nbsp; X 공격</div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
