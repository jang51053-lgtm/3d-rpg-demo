<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D RPG Demo</title>
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="damage-flash"></div>

  <div id="hud">
    <div id="status">
      <div class="status-name">휴리안</div>
      <div class="bar hp"><div id="hp-fill" class="fill"></div></div>
      <div class="bar mp"><div id="mp-fill" class="fill"></div></div>
    </div>

    <div id="objective">남은 적: <span id="enemy-count">0</span></div>

    <div id="toast"></div>

    <div id="skills">
      <div class="skill" id="skill-roll" title="구르기 (Space)">
        <div class="skill-key">SPACE</div>
        <div class="skill-icon">🤸</div>
        <div class="skill-cooldown" id="roll-cooldown"></div>
      </div>
      <div class="skill" id="skill-charge" title="돌진 (Shift)">
        <div class="skill-key">SHIFT</div>
        <div class="skill-icon">⚡</div>
        <div class="skill-cooldown" id="charge-cooldown"></div>
      </div>
      <div class="skill" id="skill-block" title="방어 (우클릭 / Q 길게)">
        <div class="skill-key">우클릭</div>
        <div class="skill-icon">🛡️</div>
        <div class="skill-cooldown" id="block-cooldown"></div>
      </div>
      <div class="skill" id="skill-attack" title="공격 (좌클릭)">
        <div class="skill-key">좌클릭</div>
        <div class="skill-icon">🗡️</div>
        <div class="skill-cooldown" id="attack-cooldown"></div>
      </div>
    </div>

    <div id="hint">
      WASD 이동 &nbsp;·&nbsp; 좌클릭 공격 &nbsp;·&nbsp; 우클릭(홀드) 방어 &nbsp;·&nbsp; Space 구르기 &nbsp;·&nbsp; Shift 돌진
      &nbsp;— 터치는 아래 버튼
    </div>
  </div>

  <div id="loading">캐릭터 불러오는 중…</div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
